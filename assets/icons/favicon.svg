<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 211, 238, 0.45)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.12)" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container squircle -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="url(#bg)" stroke="url(#border)" stroke-width="1" />

  <!-- Ambient light glow -->
  <circle cx="21" cy="11" r="7" fill="#06b6d4" opacity="0.18" />

  <!-- Brand Mark Three Rising Pillars -->
  <!-- Bar 1 (Lowest) -->
  <rect x="6" y="16" width="5" height="9" rx="1.5" fill="url(#bar1)" opacity="0.5" />

  <!-- Bar 2 (Middle) -->
  <rect x="13.5" y="11" width="5" height="14" rx="1.5" fill="url(#bar2)" opacity="0.8" />

  <!-- Bar 3 (Tallest with glow) -->
  <rect x="21" y="6" width="5" height="19" rx="1.5" fill="url(#bar3)" filter="url(#glow)" />
</svg>
